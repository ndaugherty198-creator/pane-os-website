<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ba0f5"/><stop offset="1" stop-color="#0063b1"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6470"/><stop offset="1" stop-color="#2e353d"/>
    </linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd84d"/><stop offset="1" stop-color="#f0a30a"/>
    </linearGradient>
  </defs>
  <!-- back monitor -->
  <rect x="4" y="6" width="34" height="24" rx="3" fill="url(#frame)"/>
  <rect x="6.5" y="8.5" width="29" height="19" rx="1.5" fill="url(#scr)" opacity="0.85"/>
  <rect x="17" y="30" width="8" height="4" fill="#3f4852"/>
  <rect x="12" y="33.5" width="18" height="3" rx="1.5" fill="#3f4852"/>
  <!-- cable between the two -->
  <path d="M21 37 V44 H40" fill="none" stroke="#2e353d" stroke-width="3" stroke-linecap="round"/>
  <!-- front monitor -->
  <rect x="24" y="22" width="36" height="26" rx="3" fill="url(#frame)"/>
  <rect x="26.5" y="24.5" width="31" height="21" rx="1.5" fill="url(#scr)"/>
  <path d="M30 41 q12 -16 24 0" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
  <path d="M35 41 q7 -9 14 0" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
  <circle cx="42" cy="41" r="2.2" fill="#ffffff"/>
  <rect x="38" y="48" width="8" height="5" fill="#3f4852"/>
  <rect x="32" y="52.5" width="20" height="3.5" rx="1.75" fill="#3f4852"/>
  <!-- network plug -->
  <rect x="6" y="44" width="14" height="13" rx="2.5" fill="url(#plug)"/>
  <rect x="9" y="47" width="8" height="5" rx="1" fill="#7a4d00"/>
  <path d="M10.5 49.5 h5" stroke="#ffd84d" stroke-width="1.2"/>
</svg>
